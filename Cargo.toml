[[bench]]
harness = false
name = "bench"
path = "benches/bench.rs"

[dependencies]
memchr = { version = "2.8", default-features = false }
serde = { features = ["derive"], optional = true, version = "1" }

[dev-dependencies]
regex = { version = "1" }
criterion = "0.5"
pretty_assertions = { workspace = true }
serde_json = { version = "1" }

[features]
default = []
json = ["serde"]
serde = ["dep:serde"]

[package]
authors = ["Titus Wormer <tituswormer@gmail.com>"]
categories = ["compilers", "encoding", "parser-implementations", "parsing", "text-processing"]
description = "CommonMark compliant markdown parser in Rust with ASTs and extensions"
edition = "2018"
homepage = "https://github.com/base-rs/base-markdown"
include = ["src/**", "context/**", "readme.md", "license.md", "releases.md", "releases/**"]
keywords = ["commonmark", "markdown", "parse", "render", "tokenize"]
license = "MIT"
name = "base-markdown"
readme = "readme.md"
repository = "https://github.com/base-rs/base-markdown"
rust-version = "1.73"
version = "0.1.3"

[workspace]
members = ["generate", "bake"]
resolver = "2"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]

[workspace.dependencies]
pretty_assertions = "1"
