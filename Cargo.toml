[[bench]]
harness = false
name = "bench"
path = "benches/bench.rs"

[dependencies]
log = { optional = true, version = "0.4" }
regex = { version = "1" }
serde = { features = ["derive"], optional = true, version = "1" }
unicode-id = { features = ["no_std"], version = "0.3" }

[dev-dependencies]
criterion = "0.5"
env_logger = "0.11"
pretty_assertions = { workspace = true }
serde_json = { version = "1" }
swc_core = { version = "50", features = [
  "common",
  "ecma_ast",
  "ecma_parser",
  "ecma_visit",
] }

[features]
default = []
json = ["serde"]
log = ["dep:log"]
serde = ["dep:serde"]

[package]
authors = ["Titus Wormer <tituswormer@gmail.com>"]
categories = ["compilers", "encoding", "parser-implementations", "parsing", "text-processing"]
description = "CommonMark compliant markdown parser in Rust with ASTs and extensions"
edition = "2018"
homepage = "https://github.com/socketry/socketry-markdown-rust"
include = ["src/**", "context/**", "readme.md", "license.md", "releases.md"]
keywords = ["commonmark", "markdown", "parse", "render", "tokenize"]
license = "MIT"
name = "socketry-markdown"
readme = "readme.md"
repository = "https://github.com/socketry/socketry-markdown-rust"
rust-version = "1.73"
version = "0.7.0"

[workspace]
members = ["generate", "bake"]
resolver = "2"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["core-rs/maintainers"]

[workspace.dependencies]
pretty_assertions = "1"
